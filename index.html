<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>İnşaat Muhasebe</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23c2410c'/><path d='M7 24V14l9-6 9 6v10h-6v-6h-6v6z' fill='white'/></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="boot" class="boot">Yükleniyor…</div>

  <!-- Giriş ekranı (yalnızca bulut modunda) -->
  <div id="login" class="login" hidden>
    <form id="loginForm" class="login-card">
      <div class="brand-mark big">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 24V14l9-6 9 6v10h-6v-6h-6v6z" fill="currentColor"/></svg>
      </div>
      <h1 class="firm-name">İnşaat Muhasebe</h1>
      <p class="muted">Devam etmek için giriş yapın</p>
      <label class="fld"><span>E-posta</span><input name="email" type="email" autocomplete="username" required></label>
      <label class="fld"><span>Şifre</span><input name="password" type="password" autocomplete="current-password" required></label>
      <p class="form-error" hidden></p>
      <button class="btn primary block" type="submit">Giriş yap</button>
    </form>
  </div>

  <!-- Uygulama -->
  <div id="shell" hidden>
    <header class="topbar">
      <a class="brand" href="#/ozet">
        <span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 24V14l9-6 9 6v10h-6v-6h-6v6z" fill="currentColor"/></svg></span>
        <span class="firm-name">İnşaat Muhasebe</span>
      </a>
      <label class="proj-pick">
        <span class="sr-only">Proje</span>
        <select id="projectSelect"></select>
      </label>
    </header>
    <nav class="tabs" id="tabs">
      <a href="#/ozet" data-page="ozet">Özet</a>
      <a href="#/anlasmalar" data-page="anlasmalar">Taşeron Anlaşmaları</a>
      <a href="#/odemeler" data-page="odemeler">Ödemeler</a>
      <a href="#/giderler" data-page="giderler">Giderler</a>
      <a href="#/belgeler" data-page="belgeler">Faturalar &amp; Belgeler</a>
      <a href="#/projeler" data-page="projeler">Projeler</a>
      <a href="#/ayarlar" data-page="ayarlar">Ayarlar</a>
    </nav>
    <div id="localBanner" class="banner" hidden>
      <b>Yerel mod:</b> Veriler yalnızca bu tarayıcıda saklanıyor. Kalıcı ve çok cihazlı kullanım için Supabase ayarlarını yapın (README).
    </div>
    <main id="view" class="view"></main>
  </div>

  <dialog id="modal" class="modal"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
